name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  MORNYE_DISCORD_SDK: "0"

jobs:
  analyze:
    name: Dart analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (errors only fail the build)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.log

      - name: Publish analysis log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          { echo "run ${{ github.run_number }} ${{ github.sha }}"; grep -E "^ *(error|warning) " analyze.log | head -300; tail -5 analyze.log; } > /tmp/logs/analyze.txt || true
          grep -E "^ *error " analyze.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A && git commit -qm "analyze ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  build-ios:
    name: Unsigned iOS IPA
    needs: analyze
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Activate Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-ios-${{ hashFiles('rust_backend/rust-toolchain.toml', 'rust_backend/Cargo.lock') }}

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Normalize ffmpeg plugin shell scripts
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build iOS (unsigned)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)" 2>&1 | tee build.log

      - name: Publish build errors to ci-logs-ios branch
        if: failure()
        run: |
          mkdir -p /tmp/logs
          { echo "run ${{ github.run_number }} ${{ github.sha }}"; grep -E "error:|Error:|error \(|Failed" build.log | sort -u | head -300; tail -60 build.log; } > /tmp/logs/build.txt || true
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          cd /tmp/logs
          git init -q -b ci-logs-ios
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A && git commit -qm "ios ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-ios

      - name: Add alternate app icons (Tune icons)
        run: |
          APP=build/ios/iphoneos/Runner.app
          PLIST="$APP/Info.plist"
          cp ios/AlternateIcons/*.png "$APP/"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad:CFBundleAlternateIcons" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundleAlternateIcons dict" "$PLIST"
          for NAME in TuneIconPink TuneIconDark TuneIconLight; do
            for KEY in "CFBundleIcons" "CFBundleIcons~ipad"; do
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME dict" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST"
              if [ "$KEY" = "CFBundleIcons~ipad" ]; then
                /usr/libexec/PlistBuddy -c "Add :$KEY:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:1 string ${NAME}83.5x83.5" "$PLIST"
              fi
            done
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$PLIST"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Mornye-Tune.ipa Payload
          ls -lh Mornye-Tune.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mornye-Tune-ipa
          path: Mornye-Tune.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mornye + Tune build ${{ github.run_number }}
          body: "Unsigned IPA. Install with SideStore. Commit: ${{ github.sha }}"
          prerelease: true
          files: Mornye-Tune.ipa
